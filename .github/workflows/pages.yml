name: Demo site

# The read-only public demo: the React app built in static mode, reading the
# snapshot in demo/snapshot (a fictional candidate run through the real pipeline).
on:
  push:
    branches: [main]
    paths: ["frontend/**", "demo/snapshot/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the static demo
        working-directory: frontend
        env:
          VITE_STATIC_DEMO: "1"
          VITE_BASE: /cn-job-agent/
        run: |
          npm ci --no-fund --no-audit
          npm run build
      - name: Add the snapshot and the SPA fallback
        run: |
          cp -r demo/snapshot frontend/dist/demo-data
          cp frontend/dist/index.html frontend/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
