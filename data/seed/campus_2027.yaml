# 来源：个人求职档案 11_大企业校招手册.md（2026-11-21 联网整理、交叉核对）。
# 只录入手册里有的内容，不补猜。window 是公开的毕业时间窗口：
#   [起, 止]，写到月（2026-01）表示整月，写到日（2026-07-01）表示具体日期，null 表示没公布。
