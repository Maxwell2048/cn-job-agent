# PostgreSQL 17 with the pgvector extension.
#   docker compose up -d db
# Bound to localhost only; the password comes from .env.
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cn_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cn_job_agent}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cn_agent} -d ${POSTGRES_DB:-cn_job_agent}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pg_data:
